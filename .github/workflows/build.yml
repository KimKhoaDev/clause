name: Android CI

on:
  push:
    branches:
      - "**"
    tags:
      - v*
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Thay đổi thành 11 hoặc 21 nếu dự án của bạn yêu cầu khác

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Discord Social SDK
        env:
          GH_TOKEN: ${{ secrets.DISCORD_SDK_TOKEN }}
          DISCORD_SDK_REPOSITORY: ${{ vars.DISCORD_SDK_REPOSITORY }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ] || [ -z "${DISCORD_SDK_REPOSITORY:-}" ]; then
            echo "::error::Configure the DISCORD_SDK_REPOSITORY Actions variable and DISCORD_SDK_TOKEN Actions secret."
            exit 1
          fi

          mkdir -p app/libs
          gh release download 'discord-sdk-1.10.19337' \
            --repo "$DISCORD_SDK_REPOSITORY" \
            --pattern 'discord_partner_sdk.aar' \
            --dir app/libs \
            --clobber

          if ! printf '%s  %s\n' \
            'b1b2491f1e1848c79fd6f1986d5aa1e0c8019e88a6e62c7be06b89e8e4870933' \
            'app/libs/discord_partner_sdk.aar' | sha256sum --check --status; then
            echo "::error::The Discord SDK AAR does not match the pinned 1.10.19337 build."
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
